<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Lady Chatbot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <!-- Main container for the entire chatbot -->
    <div id="chatbot-container" class="w-full max-w-md bg-white rounded-xl shadow-xl flex flex-col h-[80vh]">
        
        <!-- Header section for the chatbot title -->
        <div id="chatbot-header" class="p-4 border-b bg-blue-500 text-white rounded-t-xl">
            <h1 class="text-xl font-bold text-center">Iron Lady Leadership Assistant</h1>
        </div>

        <!-- Area where all chat messages will be displayed -->
        <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4">
            <!-- Chat messages will be dynamically added here by JavaScript -->
        </div>

        <!-- Form for user input -->
        <form id="chat-form" class="p-4 border-t flex items-center">
            <input type="text" id="user-input" placeholder="Ask about our programs..." class="flex-1 p-2 border rounded-l-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" id
            ="send-button" class="bg-blue-500 text-white p-2 rounded-r-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <!-- Corrected SVG viewBox -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 28.12 28.12 0 0 0 15.247-8.684.75.75 0 0 0 0-1.036A28.12 28.12 0 0 0 3.478 2.404Z" />
                </svg>
            </button>
        </form>

    </div>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
